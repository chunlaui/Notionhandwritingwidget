<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>손필기 화이트보드</title>
<style>
	:root{
		--text: #2C2C2B;
		--text-secondary: #7D7A75;
		--canvas: #FFFFFF;
		--surface: #F9F8F7;
		--surface-2: #F0EFED;
		--border: #E6E5E3;
		--accent: #2783DE;
		--accent-soft: #E5F2FC;
		--danger: #E56458;
		--danger-soft: #FCE9E7;

		--btn: clamp(28px, 4.2vw, 38px);
		--icon: clamp(15px, 2vw, 19px);
		--swatch: clamp(20px, 3vw, 26px);
		--gap: clamp(4px, 0.9vw, 8px);
		--pad: clamp(6px, 1.1vw, 12px);
		--radius: clamp(10px, 1.4vw, 14px);
		--fs-small: clamp(10px, 1.5vw, 12px);
	}
	*{box-sizing:border-box;}
	html,body{
		margin:0; padding:0; width:100%; height:100%; overflow:hidden;
		background:var(--canvas); color:var(--text);
		font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
		touch-action:none; -webkit-user-select:none; user-select:none; overscroll-behavior:none;
	}
	#app{position:fixed; inset:0; overflow:hidden;}
	canvas#board{position:absolute; inset:0; display:block; touch-action:none;}

	.panel{
		position:fixed; top:var(--gap); left:var(--gap); z-index:20;
		background:rgba(255,255,255,0.92); backdrop-filter:blur(6px);
		border:1px solid var(--border); border-radius:var(--radius);
		padding:var(--pad); display:flex; flex-direction:column; gap:var(--gap);
		box-shadow:0 1px 2px rgba(0,0,0,.05), 0 4px 12px rgba(0,0,0,.04);
		max-width:min(92vw, 340px);
	}
	.row{display:flex; align-items:center; gap:var(--gap); flex-wrap:wrap;}
	.divider{height:1px; background:var(--border); margin:1px 0;}

	button{font:inherit; border:none; background:none; cursor:pointer; color:var(--text);}
	.tool-btn{
		width:var(--btn); height:var(--btn); min-width:44px; min-height:34px;
		display:flex; align-items:center; justify-content:center;
		border-radius:calc(var(--radius) - 4px); border:1px solid transparent;
		background:var(--surface); color:var(--text-secondary);
		transition:background .12s, color .12s, border-color .12s;
	}
	.tool-btn svg{width:var(--icon); height:var(--icon);}
	.tool-btn:hover{background:var(--surface-2);}
	.tool-btn.active{background:var(--accent-soft); color:var(--accent); border-color:var(--accent);}
	.tool-btn.danger:hover{background:var(--danger-soft); color:var(--danger);}

	.color-swatch{
		width:var(--swatch); height:var(--swatch); border-radius:50%;
		border:2px solid var(--border); position:relative; padding:0; flex:none;
		transition:transform .1s, border-color .1s; overflow:hidden;
	}
	.color-swatch:hover{transform:scale(1.08);}
	.color-swatch.active{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft);}
	.color-swatch.wheel{
		background:conic-gradient(from 0deg, #ff0000, #ffea00, #37ff00, #00fff6, #0026ff, #ff00e6, #ff0000);
	}
	.color-swatch.wheel input[type=color]{
		position:absolute; inset:-4px; width:calc(100% + 8px); height:calc(100% + 8px);
		opacity:0; border:none; padding:0; cursor:pointer;
	}

	.width-row{padding:0 2px;}
	.width-row input[type=range]{
		width:clamp(72px, 16vw, 130px); accent-color:var(--accent); cursor:pointer;
	}
	.width-dot{
		width:10px; height:10px; border-radius:50%; background:var(--text); flex:none;
	}
	#widthLabel{font-size:var(--fs-small); color:var(--text-secondary); min-width:2.4em; text-align:right;}

	#homeBtn{
		position:fixed; right:var(--gap); bottom:var(--gap); z-index:20;
		width:var(--btn); height:var(--btn); min-width:40px; min-height:40px;
		border-radius:50%; background:rgba(255,255,255,0.95); border:1px solid var(--border);
		display:flex; align-items:center; justify-content:center; color:var(--text-secondary);
		box-shadow:0 1px 2px rgba(0,0,0,.05), 0 4px 12px rgba(0,0,0,.08);
		opacity:0; pointer-events:none; transform:translateY(6px);
		transition:opacity .18s, transform .18s, background .12s, color .12s;
	}
	#homeBtn svg{width:var(--icon); height:var(--icon);}
	#homeBtn:hover{background:var(--accent-soft); color:var(--accent);}
	#homeBtn.visible{opacity:1; pointer-events:auto; transform:translateY(0);}

	.credit-link{
		align-self:flex-end;
		margin-top:2px;
		font-size:clamp(9px, 1.3vw, 11px);
		line-height:1.2;
		color:#B8B6B2;
		text-decoration:none;
		touch-action:auto;
		-webkit-user-select:auto;
		user-select:auto;
	}
	.credit-link:hover,
	.credit-link:focus-visible{
		color:#8F8C87;
		text-decoration:underline;
		outline:none;
	}

	#zoomIndicator{
		position:fixed; top:var(--gap); right:var(--gap); z-index:20;
		background:rgba(255,255,255,0.88); border:1px solid var(--border); border-radius:999px;
		padding:4px 10px; font-size:var(--fs-small); color:var(--text-secondary);
		pointer-events:none; user-select:none;
	}

	#confirmPop{
		position:fixed; z-index:30; background:var(--canvas); border:1px solid var(--border);
		border-radius:10px; padding:10px; box-shadow:0 4px 16px rgba(0,0,0,.12);
		display:none; flex-direction:column; gap:8px; font-size:var(--fs-small); width:180px;
	}
	#confirmPop.visible{display:flex;}
	#confirmPop .msg{color:var(--text);}
	#confirmPop .actions{display:flex; gap:6px; justify-content:flex-end;}
	#confirmPop button{
		padding:5px 10px; border-radius:6px; font-size:var(--fs-small);
	}
	#confirmPop .cancel{background:var(--surface); color:var(--text);}
	#confirmPop .ok{background:var(--danger); color:#fff;}

	#toast{
		position:fixed; left:50%; top:var(--gap); transform:translate(-50%,-8px);
		background:rgba(44,44,43,0.92); color:#fff; font-size:var(--fs-small);
		padding:7px 14px; border-radius:999px; z-index:40; white-space:nowrap;
		opacity:0; pointer-events:none; transition:opacity .18s, transform .18s;
	}
	#toast.visible{opacity:1; transform:translate(-50%,0);}

	#exportModal{
		position:fixed; inset:0; z-index:50; background:rgba(44,44,43,0.55);
		display:flex; align-items:center; justify-content:center; padding:24px;
		opacity:0; pointer-events:none; transition:opacity .16s; touch-action:auto;
	}
	#exportModal.visible{opacity:1; pointer-events:auto;}
	.exportCard{
		background:#fff; border-radius:var(--radius); max-width:min(92vw, 480px);
		max-height:88vh; display:flex; flex-direction:column; overflow:hidden;
		box-shadow:0 12px 40px rgba(0,0,0,0.22);
	}
	.exportHead{
		display:flex; align-items:center; justify-content:space-between;
		padding:12px 14px; font-size:14px; font-weight:600; color:var(--text);
		border-bottom:1px solid var(--border);
	}
	.exportHead button{
		width:26px; height:26px; border-radius:7px; display:flex; align-items:center; justify-content:center;
		color:var(--text-secondary); background:transparent;
	}
	.exportHead button:hover{background:var(--surface-2);}
	.exportHead button svg{width:15px; height:15px;}
	.exportBody{
		flex:1; overflow:auto; background:var(--surface); display:flex; align-items:center; justify-content:center; padding:12px;
	}
	.exportBody img{max-width:100%; max-height:60vh; display:block; -webkit-user-select:auto; user-select:auto; -webkit-touch-callout:default; touch-action:auto; border-radius:6px; box-shadow:0 0 0 1px var(--border);}
	.exportHint{
		padding:10px 14px 0; font-size:var(--fs-small); color:var(--text-secondary); line-height:1.5;
	}
	.exportActions{
		padding:12px 14px 0; display:flex; flex-direction:column; gap:8px;
	}
	.shareBtn{
		width:100%; padding:11px; border-radius:8px;
		background:var(--accent); color:#fff; font-size:14px; font-weight:600;
		transition:background .12s, opacity .12s;
	}
	.shareBtn:hover{background:#1f6fc4;}
	.shareBtn[hidden]{display:none;}
	.copyBtn{
		width:100%; padding:11px; border-radius:8px; border:1px solid var(--border); box-sizing:border-box;
		background:var(--surface); color:var(--text); font-size:14px; font-weight:600;
		transition:background .12s, opacity .12s;
	}
	.copyBtn:hover{background:var(--surface-2);}
	.copyBtn:disabled{opacity:.55; cursor:default;}
	.openTabBtn{
		display:block; width:100%; padding:11px; border-radius:8px; box-sizing:border-box;
		background:var(--surface-2); color:var(--text); font-size:14px; font-weight:600;
		text-align:center; text-decoration:none; touch-action:auto;
		-webkit-user-select:auto; user-select:auto;
	}
	.openTabBtn:hover{background:var(--border);}

	@media (max-width:420px){
		.panel{max-width:94vw;}
	}
</style>
</head>
<body>
<div id="app">
	<canvas id="board"></canvas>

	<div class="panel" id="toolbar">
		<div class="row">
			<button class="tool-btn active" data-tool="pen" title="펜">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
			</button>
			<button class="tool-btn" data-tool="eraser" title="지우개">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H9l-6-6a2 2 0 0 1 0-2.8L13.2 2a2 2 0 0 1 2.8 0l6 6a2 2 0 0 1 0 2.8L13 19"/><path d="M9 12l6 6"/></svg>
			</button>
			<button class="tool-btn" data-tool="pan" title="이동">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-4 0v5"/><path d="M14 10V4a2 2 0 0 0-4 0v7"/><path d="M10 10.5V6a2 2 0 0 0-4 0v9"/><path d="M6 14.5V13a2 2 0 0 0-4 0v3a8 8 0 0 0 8 8h2a8 8 0 0 0 8-8v-4a2 2 0 0 0-4 0"/></svg>
			</button>
			<button class="tool-btn" id="exportBtn" title="이미지로 내보내기">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
			</button>
			<button class="tool-btn danger" id="clearBtn" title="전체 삭제">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
			</button>
		</div>
		<div class="divider"></div>
		<div class="row">
			<button class="color-swatch active" data-color="#1F1F1E" style="background:#1F1F1E" title="검정"></button>
			<button class="color-swatch" data-color="#E5473B" style="background:#E5473B" title="빨강"></button>
			<button class="color-swatch" data-color="#2265D8" style="background:#2265D8" title="파랑"></button>
			<button class="color-swatch" data-color="#2E9E52" style="background:#2E9E52" title="초록"></button>
			<label class="color-swatch wheel" title="색상환">
				<input type="color" id="colorWheel" value="#1F1F1E">
			</label>
		</div>
		<div class="divider"></div>
		<div class="row width-row">
			<span class="width-dot" id="widthDot"></span>
			<input type="range" id="widthSlider" min="0.1" max="10" step="0.1" value="2.5">
			<span id="widthLabel">2.5</span>
		</div>
		<a class="credit-link" href="https://chunlaui-guide.notion.site/brand-home?utm_source=notionwidgetcopyright&utm_medium=widget_handwritin&utm_campaign=widgetcopyright" target="_blank" rel="noopener noreferrer">Created by Chunlaui Notion Guide</a>
	</div>

	<div id="zoomIndicator">100%</div>

	<button id="homeBtn" title="처음 위치로">
		<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
	</button>

	<div id="toast"></div>

	<div id="exportModal">
		<div class="exportCard">
			<div class="exportHead">
				<span>이미지 저장</span>
				<button id="exportModalClose" aria-label="닫기">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
				</button>
			</div>
			<div class="exportBody">
				<img id="exportModalImg" alt="내보낸 손글씨 이미지">
			</div>
			<div class="exportActions">
				<button id="exportShareBtn" class="shareBtn" hidden>사진에 저장 / 공유하기</button>
				<button id="exportCopyBtn" class="copyBtn">이미지 복사하기</button>
				<a id="exportOpenTabLink" class="openTabBtn" href="#" target="_blank" rel="noopener noreferrer">새 탭에서 열어 저장하기</a>
			</div>
			<div class="exportHint" id="exportHint">노션 앱 임베드에서는 위 버튼들이 막혀 있을 수 있어요. 그럴 땐 이 위젯을 브라우저(Safari/Chrome)에서 직접 열어 내보내기를 시도해 주세요.</div>
		</div>
	</div>

	<div id="confirmPop">
		<div class="msg">보드를 전체 삭제할까요?</div>
		<div class="actions">
			<button class="cancel" id="confirmCancel">취소</button>
			<button class="ok" id="confirmOk">삭제</button>
		</div>
	</div>
</div>

<script>
(function(){
	'use strict';
	const canvas = document.getElementById('board');
	const ctx = canvas.getContext('2d');
	const toolbar = document.getElementById('toolbar');
	const homeBtn = document.getElementById('homeBtn');
	const zoomIndicator = document.getElementById('zoomIndicator');
	const clearBtn = document.getElementById('clearBtn');
	const confirmPop = document.getElementById('confirmPop');
	const confirmOk = document.getElementById('confirmOk');
	const confirmCancel = document.getElementById('confirmCancel');
	const widthSlider = document.getElementById('widthSlider');
	const widthLabel = document.getElementById('widthLabel');
	const widthDot = document.getElementById('widthDot');
	const colorWheel = document.getElementById('colorWheel');

	// ---- state ----
	let tool = 'pen';
	let color = '#1F1F1E';
	let penWidth = 2.5;
	let scale = 1, tx = 0, ty = 0;
	let cssW = window.innerWidth, cssH = window.innerHeight;
	let INITIAL = { scale: 1, tx: cssW / 2, ty: cssH / 2 };
	const MIN_SCALE = 0.12, MAX_SCALE = 8;
	const ERASER_RADIUS_PX = 14;

	// Uses sessionStorage (not localStorage): the drawing survives reloads
	// within the same browser tab/session, but is automatically cleared
	// once that session ends (tab closed). No per-file ID here on purpose —
	// the intended flow is draw -> export image -> paste the image into the
	// Notion page, so the board itself never needs to be the persisted
	// artifact or stay isolated between pages.
	const STORAGE_KEY = 'notion-handwriting-whiteboard-v1';
	let saveTimer = null;
	function scheduleSave(){
		if (saveTimer) clearTimeout(saveTimer);
		saveTimer = setTimeout(saveState, 400);
	}
	function saveState(){
		try{
			if (saveTimer){ clearTimeout(saveTimer); saveTimer = null; }
			const data = strokes.map(function(s){ return { c: s.color, w: s.width, p: s.points }; });
			sessionStorage.setItem(STORAGE_KEY, JSON.stringify(data));
		}catch(e){ /* storage unavailable - drawing still works, just won't persist */ }
	}
	function loadState(){
		try{
			const raw = sessionStorage.getItem(STORAGE_KEY);
			if (!raw) return;
			const data = JSON.parse(raw);
			if (Array.isArray(data)){
				data.forEach(function(d){
					if (d && Array.isArray(d.p) && d.p.length){
						strokes.push({ color: d.c || '#1F1F1E', width: typeof d.w === 'number' ? d.w : 2.5, points: d.p });
					}
				});
			}
		}catch(e){ /* storage unavailable */ }
	}

	const strokes = [];
	let currentStroke = null;
	let isErasing = false;
	let isPanning = false;
	let panStart = null;
	const activePointers = new Map();
	let pinchState = null;

	// ---- sizing ----
	function resizeCanvas(){
		cssW = window.innerWidth; cssH = window.innerHeight;
		const dpr = window.devicePixelRatio || 1;
		canvas.width = Math.round(cssW * dpr);
		canvas.height = Math.round(cssH * dpr);
		canvas.style.width = cssW + 'px';
		canvas.style.height = cssH + 'px';
		render();
	}

	// ---- coordinate helpers ----
	function screenToWorld(x, y){ return [ (x - tx) / scale, (y - ty) / scale ]; }
	function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

	// ---- rendering ----
	function drawGrid(){
		const left = (0 - tx) / scale, top = (0 - ty) / scale;
		const right = (cssW - tx) / scale, bottom = (cssH - ty) / scale;
		let spacing = 40;
		let guard = 0;
		while (spacing * scale < 26 && guard < 20){ spacing *= 2; guard++; }
		guard = 0;
		while (spacing * scale > 150 && guard < 20){ spacing /= 2; guard++; }
		const startX = Math.floor(left / spacing) * spacing;
		const startY = Math.floor(top / spacing) * spacing;
		ctx.fillStyle = 'rgba(44,44,43,0.14)';
		const r = 1.4;
		for (let x = startX; x <= right + spacing; x += spacing){
			for (let y = startY; y <= bottom + spacing; y += spacing){
				ctx.beginPath();
				ctx.arc(x, y, r, 0, Math.PI * 2);
				ctx.fill();
			}
		}
	}

	function drawStroke(targetCtx, s){
		const pts = s.points;
		if (!pts.length) return;
		targetCtx.lineCap = 'round';
		targetCtx.lineJoin = 'round';
		targetCtx.strokeStyle = s.color;
		targetCtx.fillStyle = s.color;
		targetCtx.lineWidth = Math.max(s.width, 0.06);
		if (pts.length === 1){
			targetCtx.beginPath();
			targetCtx.arc(pts[0][0], pts[0][1], s.width / 2, 0, Math.PI * 2);
			targetCtx.fill();
			return;
		}
		targetCtx.beginPath();
		targetCtx.moveTo(pts[0][0], pts[0][1]);
		for (let i = 1; i < pts.length - 1; i++){
			const mx = (pts[i][0] + pts[i + 1][0]) / 2;
			const my = (pts[i][1] + pts[i + 1][1]) / 2;
			targetCtx.quadraticCurveTo(pts[i][0], pts[i][1], mx, my);
		}
		targetCtx.lineTo(pts[pts.length - 1][0], pts[pts.length - 1][1]);
		targetCtx.stroke();
	}

	function render(){
		const dpr = window.devicePixelRatio || 1;
		ctx.setTransform(1, 0, 0, 1, 0, 0);
		ctx.clearRect(0, 0, canvas.width, canvas.height);
		ctx.fillStyle = '#FFFFFF';
		ctx.fillRect(0, 0, canvas.width, canvas.height);
		ctx.setTransform(scale * dpr, 0, 0, scale * dpr, tx * dpr, ty * dpr);
		drawGrid();
		for (const s of strokes) drawStroke(ctx, s);
	}

	// ---- toast ----
	const toastEl = document.getElementById('toast');
	let toastTimer = null;
	function showToast(msg){
		toastEl.textContent = msg;
		toastEl.classList.add('visible');
		if (toastTimer) clearTimeout(toastTimer);
		toastTimer = setTimeout(function(){ toastEl.classList.remove('visible'); }, 1800);
	}

	// ---- export current drawing as a cropped PNG image ----
	const exportBtn = document.getElementById('exportBtn');
	function exportImage(){
		if (!strokes.length){ showToast('내보낼 내용이 없어요'); return; }
		let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
		for (const s of strokes){
			const half = s.width / 2;
			for (const p of s.points){
				if (p[0] - half < minX) minX = p[0] - half;
				if (p[0] + half > maxX) maxX = p[0] + half;
				if (p[1] - half < minY) minY = p[1] - half;
				if (p[1] + half > maxY) maxY = p[1] + half;
			}
		}
		const PAD = 24;
		minX -= PAD; minY -= PAD; maxX += PAD; maxY += PAD;
		const boundsW = Math.max(1, maxX - minX);
		const boundsH = Math.max(1, maxY - minY);
		// image pixel size stays proportional to the strokes' area; upscale a bit for sharpness, capped so files stay a reasonable size
		const exportScale = Math.max(1, Math.min(2, 4096 / boundsW, 4096 / boundsH));
		const outW = Math.round(boundsW * exportScale);
		const outH = Math.round(boundsH * exportScale);

		const off = document.createElement('canvas');
		off.width = outW; off.height = outH;
		const offCtx = off.getContext('2d');
		offCtx.fillStyle = '#FFFFFF';
		offCtx.fillRect(0, 0, outW, outH);
		offCtx.setTransform(exportScale, 0, 0, exportScale, -minX * exportScale, -minY * exportScale);
		for (const s of strokes) drawStroke(offCtx, s);

		// Use a data: URL (self-contained, no blob-store reference) rather than
		// a blob: URL. Blob URLs are scoped to the exact realm/origin that
		// created them — inside Notion's sandboxed artifact iframe that scope
		// can be opaque, so right-click "save image", "copy image", and opening
		// the copied image address in a new tab can all fail on a blob: URL
		// ("Unable to load preview"). A data: URL carries the actual image
		// bytes inline, so those native browser actions work independent of
		// the iframe's origin.
		const dataUrl = off.toDataURL('image/png');
		const stamp = new Date().toISOString().replace(/[:.]/g, '-');
		const filename = 'whiteboard-' + stamp + '.png';

		// Best-effort automatic download. Notion's sandboxed iframe commonly
		// blocks script-triggered downloads outright, so this may silently do
		// nothing — the modal below is the reliable path.
		try {
			const a = document.createElement('a');
			a.href = dataUrl;
			a.download = filename;
			document.body.appendChild(a);
			a.click();
			a.remove();
		} catch (e) {}

		openExportModal(dataUrl, off);
		attemptAutoCopy(off);
	}
	exportBtn.addEventListener('click', exportImage);

	// ---- fallback viewer: lets the user manually save the exported image ----
	const exportModal = document.getElementById('exportModal');
	const exportModalImg = document.getElementById('exportModalImg');
	const exportModalClose = document.getElementById('exportModalClose');
	const exportCopyBtn = document.getElementById('exportCopyBtn');
	const exportOpenTabLink = document.getElementById('exportOpenTabLink');
	const exportShareBtn = document.getElementById('exportShareBtn');
	let lastExportCanvas = null;
	let lastExportDataUrl = null;
	function openExportModal(dataUrl, offCanvas){
		lastExportCanvas = offCanvas;
		lastExportDataUrl = dataUrl;
		exportModalImg.src = dataUrl;
		exportOpenTabLink.href = dataUrl;
		exportModal.classList.add('visible');
	}
	function closeExportModal(){
		exportModal.classList.remove('visible');
	}
	exportModalClose.addEventListener('click', closeExportModal);
	exportModal.addEventListener('click', function(e){
		if (e.target === exportModal) closeExportModal();
	});

	// Notion's URL-embed iframe sandboxes downloads (no allow-downloads), so
	// the <a download> click above and even long-press/right-click "save
	// image" can be silently blocked there - hence the copy + open-in-new-tab
	// fallbacks. navigator.clipboard.write() must be called synchronously
	// inside the user-gesture handler (no preceding await) or mobile Safari
	// silently drops it for losing "user activation"; passing canvas.toBlob's
	// promise straight into ClipboardItem keeps the write() call itself sync
	// while the actual PNG encoding still happens async.
	function copyCanvasToClipboard(offCanvas, opts){
		const silent = opts && opts.silent;
		if (!offCanvas) return;
		if (!navigator.clipboard || !window.ClipboardItem){
			if (!silent) showToast('이 환경에서는 복사가 지원되지 않아요. "새 탭에서 열기"를 사용해 주세요.');
			return;
		}
		try{
			const blobPromise = new Promise(function(resolve, reject){
				offCanvas.toBlob(function(blob){
					if (blob) resolve(blob); else reject(new Error('toBlob failed'));
				}, 'image/png');
			});
			navigator.clipboard.write([ new ClipboardItem({ 'image/png': blobPromise }) ]).then(function(){
				showToast('이미지가 복사되었어요. 노션에 Ctrl+V로 붙여넣으세요.');
			}).catch(function(){
				if (!silent) showToast('복사에 실패했어요. "새 탭에서 열기"를 사용해 주세요.');
			});
		}catch(e){
			if (!silent) showToast('복사에 실패했어요. "새 탭에서 열기"를 사용해 주세요.');
		}
	}
	function attemptAutoCopy(offCanvas){
		copyCanvasToClipboard(offCanvas, { silent: true });
	}
	exportCopyBtn.addEventListener('click', function(){
		copyCanvasToClipboard(lastExportCanvas, { silent: false });
	});

	// Notion's mobile *app* renders embeds in its own native WebView (WKWebView
	// on iOS, WebView on Android), not the real mobile browser - clipboard and
	// new-tab tricks above may simply be unavailable there since the app
	// controls the WebView's capabilities, not us. navigator.share() hands off
	// to the OS-level share sheet instead of a browser API, so it works in
	// most WebViews that support it (WKWebView since iOS 15) and lets the user
	// pick "Save Image" directly. It needs actual File objects (no lazy
	// promises like ClipboardItem allows), so the blob is built synchronously
	// from the data: URL via atob - no await before share() - to avoid losing
	// user-activation the same way the clipboard call could.
	const canWebShare = typeof navigator.share === 'function';
	if (canWebShare) exportShareBtn.hidden = false;
	function dataUrlToBlobSync(dataUrl){
		const commaIdx = dataUrl.indexOf(',');
		const mimeMatch = dataUrl.slice(0, commaIdx).match(/:(.*?);/);
		const mime = mimeMatch ? mimeMatch[1] : 'image/png';
		const binary = atob(dataUrl.slice(commaIdx + 1));
		const bytes = new Uint8Array(binary.length);
		for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
		return new Blob([bytes], { type: mime });
	}
	function shareImage(dataUrl){
		if (!dataUrl || !canWebShare) return;
		try{
			const file = new File([dataUrlToBlobSync(dataUrl)], 'whiteboard-handwriting.png', { type: 'image/png' });
			if (navigator.canShare && !navigator.canShare({ files: [file] })){
				showToast('이 환경에서는 사진 공유가 지원되지 않아요. 다른 방법을 사용해 주세요.');
				return;
			}
			navigator.share({ files: [file] }).catch(function(){});
		}catch(e){
			showToast('공유에 실패했어요. 다른 방법을 사용해 주세요.');
		}
	}
	exportShareBtn.addEventListener('click', function(){
		shareImage(lastExportDataUrl);
	});

	function updateZoomIndicator(){ zoomIndicator.textContent = Math.round(scale * 100) + '%'; }

	function updateHomeVisibility(){
		const scaleDiff = Math.abs(scale - 1);
		const panDist = Math.hypot(tx - INITIAL.tx, ty - INITIAL.ty);
		const show = scaleDiff > 0.3 || panDist > 160;
		homeBtn.classList.toggle('visible', show);
	}

	function goHome(){
		const start = { scale, tx, ty };
		const end = INITIAL;
		const duration = 320;
		const t0 = performance.now();
		function step(t){
			const p = Math.min(1, (t - t0) / duration);
			const ease = 1 - Math.pow(1 - p, 3);
			scale = start.scale + (end.scale - start.scale) * ease;
			tx = start.tx + (end.tx - start.tx) * ease;
			ty = start.ty + (end.ty - start.ty) * ease;
			render();
			updateZoomIndicator();
			if (p < 1) requestAnimationFrame(step); else updateHomeVisibility();
		}
		requestAnimationFrame(step);
	}

	// ---- zoom ----
	function zoomAt(cx, cy, factor){
		const newScale = clamp(scale * factor, MIN_SCALE, MAX_SCALE);
		const wx = (cx - tx) / scale, wy = (cy - ty) / scale;
		tx = cx - wx * newScale;
		ty = cy - wy * newScale;
		scale = newScale;
		render();
		updateZoomIndicator();
		updateHomeVisibility();
	}

	canvas.addEventListener('wheel', function(e){
		e.preventDefault();
		const factor = Math.exp(-e.deltaY * 0.0015);
		zoomAt(e.clientX, e.clientY, factor);
	}, { passive: false });

	// ---- drawing ----
	function startStrokeAt(x, y){
		const [wx, wy] = screenToWorld(x, y);
		currentStroke = { color, width: penWidth, points: [[wx, wy]] };
		strokes.push(currentStroke);
		render();
		scheduleSave();
	}
	function addPointToStroke(x, y){
		if (!currentStroke) return;
		const [wx, wy] = screenToWorld(x, y);
		const pts = currentStroke.points;
		const last = pts[pts.length - 1];
		if (Math.hypot(wx - last[0], wy - last[1]) < 0.5 / scale) return;
		pts.push([wx, wy]);
		render();
		scheduleSave();
	}

	// ---- erasing ----
	function distToSegment(px, py, ax, ay, bx, by){
		const dx = bx - ax, dy = by - ay;
		const lenSq = dx * dx + dy * dy;
		let t = lenSq > 0 ? ((px - ax) * dx + (py - ay) * dy) / lenSq : 0;
		t = clamp(t, 0, 1);
		const cx = ax + t * dx, cy = ay + t * dy;
		return Math.hypot(px - cx, py - cy);
	}
	function strokeHit(s, px, py, radius){
		const pts = s.points;
		const rr = radius + s.width / 2;
		if (pts.length === 1) return Math.hypot(pts[0][0] - px, pts[0][1] - py) <= rr;
		for (let i = 0; i < pts.length - 1; i++){
			if (distToSegment(px, py, pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1]) <= rr) return true;
		}
		return false;
	}
	function eraseAt(x, y){
		const [wx, wy] = screenToWorld(x, y);
		const radius = ERASER_RADIUS_PX / scale;
		let changed = false;
		for (let i = strokes.length - 1; i >= 0; i--){
			if (strokeHit(strokes[i], wx, wy, radius)){ strokes.splice(i, 1); changed = true; }
		}
		if (changed){ render(); scheduleSave(); }
	}

	// ---- tool / color / width UI ----
	function setTool(t){
		tool = t;
		document.querySelectorAll('.tool-btn[data-tool]').forEach(function(b){
			b.classList.toggle('active', b.dataset.tool === t);
		});
		canvas.style.cursor = t === 'pen' ? 'crosshair' : t === 'eraser' ? 'cell' : 'grab';
	}
	document.querySelectorAll('.tool-btn[data-tool]').forEach(function(btn){
		btn.addEventListener('click', function(){ setTool(btn.dataset.tool); });
	});

	function setActiveSwatch(el){
		document.querySelectorAll('.color-swatch').forEach(function(s){ s.classList.remove('active'); });
		if (el) el.classList.add('active');
	}
	function setColor(c){
		color = c;
		widthDot.style.background = c;
		if (tool === 'eraser') setTool('pen');
	}
	document.querySelectorAll('.color-swatch[data-color]').forEach(function(sw){
		sw.addEventListener('click', function(){ setColor(sw.dataset.color); setActiveSwatch(sw); });
	});
	colorWheel.addEventListener('input', function(){
		setColor(colorWheel.value);
		setActiveSwatch(colorWheel.closest('.color-swatch'));
	});

	widthSlider.addEventListener('input', function(){
		penWidth = parseFloat(widthSlider.value);
		widthLabel.textContent = penWidth.toFixed(1);
	});

	// ---- clear all (custom confirm, avoids iframe-sandboxed window.confirm) ----
	clearBtn.addEventListener('click', function(){
		const r = clearBtn.getBoundingClientRect();
		confirmPop.style.top = (r.bottom + 8) + 'px';
		confirmPop.style.left = r.left + 'px';
		confirmPop.classList.add('visible');
	});
	confirmCancel.addEventListener('click', function(){ confirmPop.classList.remove('visible'); });
	confirmOk.addEventListener('click', function(){
		strokes.length = 0;
		currentStroke = null;
		render();
		saveState();
		confirmPop.classList.remove('visible');
	});
	document.addEventListener('pointerdown', function(e){
		if (confirmPop.classList.contains('visible') && !confirmPop.contains(e.target) && e.target !== clearBtn && !clearBtn.contains(e.target)){
			confirmPop.classList.remove('visible');
		}
	}, true);

	// ---- home button ----
	homeBtn.addEventListener('click', goHome);

	// ---- pointer / touch interaction (pen, eraser, pan, pinch-zoom) ----
	function computePinchState(pts){
		const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
		const mid = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
		return { dist: dist || 1, mid0: mid, scale0: scale, tx0: tx, ty0: ty };
	}
	function handlePinchMove(pts){
		const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) || 1;
		const mid = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
		const factor = dist / pinchState.dist;
		const newScale = clamp(pinchState.scale0 * factor, MIN_SCALE, MAX_SCALE);
		const wx = (pinchState.mid0.x - pinchState.tx0) / pinchState.scale0;
		const wy = (pinchState.mid0.y - pinchState.ty0) / pinchState.scale0;
		tx = mid.x - wx * newScale;
		ty = mid.y - wy * newScale;
		scale = newScale;
		render();
		updateZoomIndicator();
		updateHomeVisibility();
	}

	canvas.addEventListener('pointerdown', function(e){
		if (e.button === 2) return;
		canvas.setPointerCapture(e.pointerId);
		activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
		confirmPop.classList.remove('visible');

		if (activePointers.size === 1){
			if (tool === 'pen') startStrokeAt(e.clientX, e.clientY);
			else if (tool === 'eraser'){ isErasing = true; eraseAt(e.clientX, e.clientY); }
			else if (tool === 'pan'){ isPanning = true; canvas.style.cursor = 'grabbing'; panStart = { x: e.clientX, y: e.clientY, tx0: tx, ty0: ty }; }
		} else if (activePointers.size === 2){
			currentStroke = null; isErasing = false; isPanning = false;
			const pts = Array.from(activePointers.values());
			pinchState = computePinchState(pts);
		}
	});

	canvas.addEventListener('pointermove', function(e){
		if (!activePointers.has(e.pointerId)) return;
		activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

		if (activePointers.size >= 2){
			const pts = Array.from(activePointers.values()).slice(0, 2);
			if (pinchState) handlePinchMove(pts);
			return;
		}
		if (currentStroke) addPointToStroke(e.clientX, e.clientY);
		else if (isErasing) eraseAt(e.clientX, e.clientY);
		else if (isPanning){
			const dx = e.clientX - panStart.x, dy = e.clientY - panStart.y;
			tx = panStart.tx0 + dx; ty = panStart.ty0 + dy;
			render();
			updateHomeVisibility();
		}
	});

	function endPointer(e){
		if (!activePointers.has(e.pointerId)) return;
		activePointers.delete(e.pointerId);
		try{ canvas.releasePointerCapture(e.pointerId); }catch(err){}
		if (activePointers.size < 2) pinchState = null;
		if (activePointers.size === 0){
			currentStroke = null; isErasing = false; isPanning = false;
			if (tool === 'pan') canvas.style.cursor = 'grab';
		} else if (activePointers.size === 1){
			const remaining = Array.from(activePointers.values())[0];
			if (tool === 'pen') startStrokeAt(remaining.x, remaining.y);
			else if (tool === 'eraser'){ isErasing = true; eraseAt(remaining.x, remaining.y); }
			else if (tool === 'pan'){ isPanning = true; panStart = { x: remaining.x, y: remaining.y, tx0: tx, ty0: ty }; }
		}
	}
	canvas.addEventListener('pointerup', endPointer);
	canvas.addEventListener('pointercancel', endPointer);
	canvas.addEventListener('contextmenu', function(e){ e.preventDefault(); });

	// flush any pending save before the embed unloads or is hidden
	window.addEventListener('pagehide', saveState);
	window.addEventListener('beforeunload', saveState);
	document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'hidden') saveState(); });

	// ---- init ----
	window.addEventListener('resize', function(){
		const wasHome = Math.abs(scale - INITIAL.scale) < 0.001 && Math.abs(tx - INITIAL.tx) < 0.5 && Math.abs(ty - INITIAL.ty) < 0.5;
		resizeCanvas();
		INITIAL = { scale: 1, tx: cssW / 2, ty: cssH / 2 };
		if (wasHome){ scale = INITIAL.scale; tx = INITIAL.tx; ty = INITIAL.ty; render(); }
		updateHomeVisibility();
	});

	resizeCanvas();
	INITIAL = { scale: 1, tx: cssW / 2, ty: cssH / 2 };
	scale = INITIAL.scale; tx = INITIAL.tx; ty = INITIAL.ty;
	loadState();
	widthDot.style.background = color;
	setTool('pen');
	render();
	updateZoomIndicator();
	updateHomeVisibility();
})();
</script>
</body>
</html>
